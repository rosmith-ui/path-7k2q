<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garmin Chat Path</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400&display=swap">
<style>
:root{--bg:#F8FAFC;--ink:#0E0142;--muted:#6B6B80;--line:#D5D8E0;--navy:#100045;--accent:#EC622E;--accent-text:#C64A1B;--hi:#FE8756}
@media (prefers-color-scheme:dark){:root{--bg:#100045;--ink:#F4F2FF;--muted:#B8B3DA;--line:#372B7E;--navy:#2A1B7A;--accent:#FF7A45;--accent-text:#FF9A6E}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Source Sans 3',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.band{background:var(--navy);color:#fff;border-bottom:5px solid var(--accent);padding:18px 26px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.band h1{font-family:'Source Serif 4',Georgia,serif;font-weight:400;font-size:clamp(22px,2.8vw,30px);margin:0}
.band span{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--hi)}
main{flex:1;display:grid;place-items:center;padding:32px 16px}
form{width:min(100%,420px);display:flex;flex-direction:column;gap:14px}
p{margin:0;color:var(--muted);font-size:17px;line-height:1.5}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input{font:inherit;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:2px;background:#fff;color:#0E0142}
button{font:inherit;font-weight:700;font-size:17px;height:50px;border:0;border-radius:2px;background:var(--navy);color:#fff;cursor:pointer}
button:hover{background:var(--accent)}
.err{color:var(--accent-text);font-weight:700;min-height:1.4em}
footer{border-top:4px solid var(--accent);padding:12px 26px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer b{letter-spacing:.2em;color:var(--accent-text)}
</style></head><body>
<header class="band"><h1>How a chat question is answered</h1><span>Garmin  |  Cloudera AI</span></header>
<main><form id="f" autocomplete="on">
<p>This page is for the Garmin and Cloudera teams. Sign in to open it.</p>
<label>Username<input id="u" name="username" autocomplete="username" required autofocus></label>
<label>Password<input id="p" name="password" type="password" autocomplete="current-password" required></label>
<div class="err" id="e" aria-live="polite"></div>
<button type="submit">Open the page</button>
</form></main>

async function keyFor(u,p){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(u.trim().toLowerCase()+':'+p),'PBKDF2',false,['deriveKey']);
